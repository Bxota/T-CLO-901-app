replicaCount: 2

image:
  repository: ghcr.io/bxota/t-clo-901-app
  # CI replaces this only with the full source commit SHA; never use a mutable tag.
  tag: "a0f455d69feeb1dda27832ecef7d814a9881d1e0"
  pullPolicy: IfNotPresent
  pullSecrets:
    - ghcr-pull-secret

service:
  type: ClusterIP
  port: 80

fullnameOverride: laravel

# Public HTTPS entry point through the shared Envoy Gateway. The hostname must
# match a dnsNames entry of the Gateway's certificates (infra repository,
# platform/networking/base/certificates.yaml).
route:
  enabled: true
  host: app.15.224.195.86.sslip.io
  gateway:
    name: public-gateway
    namespace: envoy-gateway-system
    sectionName: https

env:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://app.15.224.195.86.sslip.io
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: app_database
  DB_USERNAME: app_user
  SESSION_DRIVER: database
  SESSION_TABLE: sessions

secret:
  name: mysql-credentials
  passwordKey: mysql-password
  rootPasswordKey: mysql-root-password
  appKeyKey: app-key

probes:
  readiness:
    path: /
    port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    path: /
    port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# One-shot `php artisan migrate --force` Job (Argo CD Sync hook, wave 3).
migration:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Vendor images. The app namespace admission policy only admits images under
# ghcr.io/bxota/, so every vendor image is a CI-maintained mirror of a pinned
# upstream tag (see .github/workflows/build-publish.yml, job mirror-vendor-images).
mysql:
  enabled: true
  fullnameOverride: mysql
  architecture: standalone
  image:
    registry: ghcr.io
    repository: bxota/bitnami-mysql
    # Mirror of docker.io/bitnamilegacy/mysql:8.0.37-debian-12-r2 (the chart 10.3.0 default image).
    tag: 8.0.37-debian-12-r2
    pullSecrets:
      - ghcr-pull-secret
  commonAnnotations:
    argocd.argoproj.io/sync-wave: "1"
  auth:
    existingSecret: mysql-credentials
    database: app_database
    username: app_user
    # Chart 10.3.0 maps this value to the MySQL 8 authentication plugin.
    defaultAuthenticationPlugin: mysql_native_password
  primary:
    persistence:
      enabled: true
      storageClass: "-"
      size: 20Gi
      selector:
        matchLabels:
          app.kubernetes.io/component: mysql-data
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

efs:
  server: fs-04525e4ba350e77a0.efs.eu-west-3.amazonaws.com
  dataPath: /mysql-data
  backupPath: /mysql-backups
  mountOptions:
    - nfsvers=4.1
  # Bitnami MySQL runs as UID/GID 1001; the backup, restore-test and restore
  # pods run as the official mysql image's UID/GID 999. EFS ignores fsGroup,
  # so the bootstrap Job chowns each export directory to its consumer.
  dataOwner: "1001:1001"
  backupOwner: "999:999"

bootstrap:
  # Mirror of docker.io/library/busybox:1.37.0.
  image: ghcr.io/bxota/busybox:1.37.0
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

backup:
  schedule: "17 2 * * *"
  restoreTestSchedule: "31 3 * * 0"
  # Dumps older than this many days are deleted after each successful dump,
  # so exactly retentionDays daily dumps are kept.
  retentionDays: 7
  # Mirror of docker.io/library/mysql:8.0.37; same major/minor as the server.
  image: ghcr.io/bxota/mysql:8.0.37
  # UID/GID of the `mysql` user inside the official mysql image.
  runAsUser: 999
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  restoreTestResources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Break-glass production restore. Never enabled in the committed default; the
# runbook's "Production data restore" procedure flips it in a reviewed commit.
restore:
  enabled: false
  # Basename of a dump under the mysql-backups PVC, for example app-2026-09-19T02-17-00Z.sql.gz
  dumpFile: ""

# Prometheus scrape target (ServiceMonitor, picked up by kube-prometheus-stack)
# and the public-gateway rule that answers 403 on /metrics so the endpoint is
# reachable from inside the cluster only.
metrics:
  enabled: true
  interval: 30s
