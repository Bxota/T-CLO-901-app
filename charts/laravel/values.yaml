replicaCount: 2

image:
  repository: ghcr.io/bxota/t-clo-901-app
  # CI replaces this only with the full source commit SHA; never use a mutable tag.
  tag: "c56c9ad5f370aa00a6fb3858a24b7fad1b6a3245"
  pullPolicy: IfNotPresent
  pullSecrets:
    - ghcr-pull-secret

service:
  type: ClusterIP
  port: 80

fullnameOverride: laravel

env:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: http://laravel.app.svc.cluster.local
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: app_database
  DB_USERNAME: app_user
  SESSION_DRIVER: database
  SESSION_TABLE: sessions

secret:
  name: mysql-credentials
  passwordKey: mysql-password

probes:
  readiness:
    path: /
    port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    path: /
    port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

mysql:
  enabled: true
  fullnameOverride: mysql
  architecture: standalone
  commonAnnotations:
    argocd.argoproj.io/sync-wave: "1"
  auth:
    existingSecret: mysql-credentials
    database: app_database
    username: app_user
    # Chart 10.3.0 maps this value to the MySQL 8 authentication plugin.
    defaultAuthenticationPlugin: mysql_native_password
  primary:
    persistence:
      enabled: true
      storageClass: "-"
      size: 20Gi
      selector:
        matchLabels:
          app.kubernetes.io/component: mysql-data
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

efs:
  server: fs-04525e4ba350e77a0.efs.eu-west-3.amazonaws.com
  dataPath: /mysql-data
  backupPath: /mysql-backups
  mountOptions:
    - nfsvers=4.1

backup:
  schedule: "17 2 * * *"
  restoreTestSchedule: "31 3 * * 0"
  retentionDays: 7
  image: mysql:8.0.37
