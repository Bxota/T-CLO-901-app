{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "laravel.fullname" . }}-mysql-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laravel.maintenanceLabels" (dict "root" . "component" "mysql-backup") | nindent 4 }}
  annotations:
    # Last wave: a CronJob whose latest run failed is Degraded, and Argo CD
    # waits for every earlier wave to be Healthy before rolling the
    # Deployment. Backups must never block an application rollout; the
    # BackupMissing alert is the signal for a missing dump.
    argocd.argoproj.io/sync-wave: "5"
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "laravel.maintenanceLabels" (dict "root" . "component" "mysql-backup") | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            {{- range .Values.image.pullSecrets }}
            - name: {{ . }}
            {{- end }}
          securityContext:
            {{- include "laravel.mysqlToolsPodSecurityContext" . | nindent 12 }}
          containers:
            - name: dump
              image: {{ .Values.backup.image | quote }}
              env:
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secret.name }}
                      key: {{ .Values.secret.passwordKey }}
              command: ["sh", "-ec"]
              args:
                - |
                  stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
                  sql_tmp="/tmp/.app-${stamp}.sql.tmp"
                  tmp="/backup/.app-${stamp}.sql.gz.tmp"
                  final="/backup/app-${stamp}.sql.gz"
                  cleanup() {
                    status=$?
                    rm -f "$sql_tmp" "$tmp"
                    exit "$status"
                  }
                  trap cleanup EXIT
                  # Dump to a file first so a mysqldump failure is never hidden behind gzip's exit status.
                  mysqldump --single-transaction --quick --routines --triggers --no-tablespaces \
                    --host={{ .Values.env.DB_HOST }} --port={{ .Values.env.DB_PORT }} --user={{ .Values.env.DB_USERNAME }} {{ .Values.env.DB_DATABASE }} > "$sql_tmp"
                  test -s "$sql_tmp"
                  gzip -9 < "$sql_tmp" > "$tmp"
                  test -s "$tmp"
                  mv "$tmp" "$final"
                  rm -f "$sql_tmp"
                  # Prune only after a successful dump. find's -mtime +N matches files
                  # older than N+1 days, so retentionDays-1 keeps exactly retentionDays daily dumps.
                  find /backup -maxdepth 1 -type f -name 'app-*.sql.gz' -mtime +{{ sub .Values.backup.retentionDays 1 }} -delete
                  echo "backup written: $final"
              securityContext:
                {{- include "laravel.restrictedContainerSecurityContext" . | nindent 16 }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: backups
                  mountPath: /backup
                - name: scratch
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: mysql-backups
            - name: scratch
              emptyDir: {}
{{- end }}
