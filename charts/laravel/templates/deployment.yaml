apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "laravel.fullname" . }}
  labels:
    {{- include "laravel.labels" . | nindent 4 }}
  annotations:
    # Argo CD sync order: EFS bootstrap (PreSync) -> PV/PVC/config (0) -> MySQL (1)
    # -> optional restore Job (2) -> migration Job (3) -> this Deployment (4).
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: {{ .Values.replicaCount }}
  # No surge pod: the strict anti-affinity below leaves no node for a third
  # replica on the two-worker lab cluster, so the rollout replaces one pod at a
  # time while the other keeps serving. A NotReady new pod never takes traffic.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      {{- include "laravel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "laravel.labels" . | nindent 8 }}
    spec:
      # preStop sleeps long enough for Envoy to drop the endpoint, then stops
      # Apache gracefully so in-flight requests complete.
      terminationGracePeriodSeconds: {{ .Values.termination.gracePeriodSeconds }}
      imagePullSecrets:
        {{- range .Values.image.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      # Replicas of the web tier must land on different nodes (subject
      # requirement); replicaCount must therefore not exceed the worker count.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "laravel.selectorLabels" . | nindent 18 }}
      containers:
        - name: laravel
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.termination.preStopSeconds }} && apache2ctl -k graceful-stop"]
          envFrom:
            - configMapRef:
                name: {{ include "laravel.fullname" . }}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.secret.passwordKey }}
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.secret.appKeyKey }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
