{{- if .Values.route.enabled }}
# Public entry point through the shared Envoy Gateway (infrastructure
# repository, platform/networking): the Gateway's https listener already
# terminates TLS with the app-tls certificate and accepts routes from every
# namespace, so the chart only has to bind the hostname to its own Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "laravel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laravel.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
      sectionName: {{ .Values.route.gateway.sectionName }}
  hostnames:
    - {{ .Values.route.host | quote }}
  rules:
    {{- if .Values.metrics.enabled }}
    # Longest path match wins: /metrics is answered by the gateway itself
    # with 403 and never reaches the pods from the internet.
    - matches:
        - path:
            type: PathPrefix
            value: /metrics
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: {{ include "laravel.fullname" . }}-metrics-forbidden
    {{- end }}
    - backendRefs:
        - name: {{ include "laravel.fullname" . }}
          port: {{ .Values.service.port }}
{{- if .Values.metrics.enabled }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: {{ include "laravel.fullname" . }}-metrics-forbidden
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laravel.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  directResponse:
    statusCode: 403
    body:
      type: Inline
      inline: "forbidden\n"
{{- end }}
{{- end }}
