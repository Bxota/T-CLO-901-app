apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "laravel.fullname" . }}
  labels:
    {{- include "laravel.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.env.APP_ENV | quote }}
  APP_DEBUG: {{ .Values.env.APP_DEBUG | quote }}
  APP_URL: {{ .Values.env.APP_URL | quote }}
  DB_CONNECTION: {{ .Values.env.DB_CONNECTION | quote }}
  DB_HOST: {{ .Values.env.DB_HOST | quote }}
  DB_PORT: {{ .Values.env.DB_PORT | quote }}
  DB_DATABASE: {{ .Values.env.DB_DATABASE | quote }}
  DB_USERNAME: {{ .Values.env.DB_USERNAME | quote }}
  SESSION_DRIVER: {{ .Values.env.SESSION_DRIVER | quote }}
  SESSION_TABLE: {{ .Values.env.SESSION_TABLE | quote }}
