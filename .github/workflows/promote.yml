name: Promote release candidate

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: Candidate tag (empty selects the highest rc tag)
        required: false
        default: ""

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/bxota/t-clo-901-app
  CHART_REPO: oci://ghcr.io/bxota/charts

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}
      - name: Select candidate and stable version
        id: version
        env:
          REQUESTED: ${{ inputs.rc_tag }}
        run: |
          rc_tag="$REQUESTED"
          if [ -z "$rc_tag" ]; then
            rc_tag="$(git tag --list 'v*-rc.*' --sort=-v:refname | head -n1)"
          fi
          [[ "$rc_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          version="${rc_tag#v}"
          version="${version%-rc.*}"
          echo "rc_tag=$rc_tag" >> "$GITHUB_OUTPUT"
          echo "rc_version=${rc_tag#v}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.rc_tag }}
          fetch-depth: 0
          # GITHUB_TOKEN cannot push a tag whose commit touches
          # .github/workflows; RELEASE_TOKEN is a PAT with the workflow scope.
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Verify immutable source artifacts
        env:
          RC_VERSION: ${{ steps.version.outputs.rc_version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rc_digest="$(docker buildx imagetools inspect "$APP_IMAGE:$RC_VERSION" --format '{{.Manifest.Digest}}')"
          if stable_digest="$(docker buildx imagetools inspect "$APP_IMAGE:$VERSION" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            if [ "$stable_digest" != "$rc_digest" ]; then
              echo "::error::$APP_IMAGE:$VERSION already exists with digest $stable_digest, but $RC_VERSION is $rc_digest; promote the rc that produced it"
              exit 1
            fi
            echo "stable_image_exists=true" >>"$GITHUB_ENV"
          fi
          if helm pull "$CHART_REPO/laravel" --version "$VERSION" --destination "$RUNNER_TEMP/stable" >/dev/null 2>&1; then
            helm package charts/laravel --destination "$RUNNER_TEMP/candidate" --version "$VERSION" --app-version "$VERSION" >/dev/null
            mkdir -p "$RUNNER_TEMP/cmp/stable" "$RUNNER_TEMP/cmp/candidate"
            tar xzf "$RUNNER_TEMP/stable/laravel-$VERSION.tgz" -C "$RUNNER_TEMP/cmp/stable"
            tar xzf "$RUNNER_TEMP/candidate/laravel-$VERSION.tgz" -C "$RUNNER_TEMP/cmp/candidate"
            if ! diff -r "$RUNNER_TEMP/cmp/stable" "$RUNNER_TEMP/cmp/candidate"; then
              echo "::error::chart laravel:$VERSION already exists with different content than $RC_VERSION"
              exit 1
            fi
            echo "stable_chart_exists=true" >>"$GITHUB_ENV"
          fi
      - name: Retag tested image digest
        if: env.stable_image_exists != 'true'
        env:
          RC_VERSION: ${{ steps.version.outputs.rc_version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: docker buildx imagetools create --tag "$APP_IMAGE:$VERSION" "$APP_IMAGE:$RC_VERSION"
      - name: Package stable chart
        if: env.stable_chart_exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm package charts/laravel --destination "$RUNNER_TEMP" --version "$VERSION" --app-version "$VERSION"
          helm push "$RUNNER_TEMP/laravel-$VERSION.tgz" "$CHART_REPO"
      - name: Tag and publish stable release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git rev-parse "v$VERSION^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "v$VERSION^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag --annotate "v$VERSION" --message "Release v$VERSION"
            git push origin "v$VERSION"
          fi
          gh release view "v$VERSION" >/dev/null 2>&1 || \
            gh release create "v$VERSION" --verify-tag --generate-notes --title "v$VERSION"
