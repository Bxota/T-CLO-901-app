name: Build and push image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'charts/laravel/values.yaml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/bxota/t-clo-901-app:${{ github.sha }}

      - name: Update Helm chart image tag
        run: |
          yq -i '.image.tag = "${{ github.sha }}"' charts/laravel/values.yaml

      - name: Commit and push the updated tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/laravel/values.yaml
          git commit -m "chore: bump app image tag to ${{ github.sha }}"
          git push
