name: Security scan (chart and image)

# Report mode: findings are published in the job summary and as artifacts but
# never fail the build. Tighten with `exit-code: '1'` once the baseline is clean.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chart-misconfigurations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and render the chart for both environments
        run: |
          helm lint --strict charts/laravel -f ci/values-stage.yaml --set-string image.tag=scan
          helm lint --strict charts/laravel -f ci/values-prod.yaml --set-string image.tag=scan
          mkdir -p rendered
          helm template app-stage charts/laravel --namespace app-stage -f ci/values-stage.yaml --set-string image.tag=scan > rendered/stage.yaml
          helm template app charts/laravel --namespace app -f ci/values-prod.yaml --set-string image.tag=scan > rendered/prod.yaml
      - name: Trivy misconfiguration scan (Kubernetes checks, HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: rendered
          severity: HIGH,CRITICAL
          format: table
          exit-code: '0'
          output: trivy-config.txt
      - name: Publish summary
        run: |
          { echo '## Chart misconfigurations (Trivy, HIGH/CRITICAL)'; echo; echo '```'; cat trivy-config.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-config
          path: trivy-config.txt

  image-vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image locally (amd64, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: t-clo-901-app:scan
          cache-from: type=gha
      - name: Trivy vulnerability scan (OS packages and Composer, HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: t-clo-901-app:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '0'
          output: trivy-image.txt
      - name: Publish summary
        run: |
          { echo '## Image vulnerabilities with an available fix (Trivy, HIGH/CRITICAL)'; echo; echo '```'; cat trivy-image.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-image
          path: trivy-image.txt
