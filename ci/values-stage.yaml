replicaCount: 1
route:
  host: app-stage.bxota.com
  gateway:
    name: internal-gateway
    namespace: envoy-gateway-system
    sectionName: https
env:
  APP_URL: https://app-stage.bxota.com
  APP_DEPLOY_ENV: staging
efs:
  enabled: false
mysql:
  primary:
    persistence:
      storageClass: local-path
backup:
  enabled: false
sealedSecrets:
  mysqlCredentials:
    encryptedData:
      app-key: stage-placeholder
      mysql-password: stage-placeholder
      mysql-root-password: stage-placeholder
  ghcrPullSecret:
    encryptedData:
      .dockerconfigjson: stage-placeholder
